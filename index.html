<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#8b0000">

  <title>Dextro</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #8b0000;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-principal {
      width: 100%;
      background: #8b0000;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .btn-excluir {
      background: #eee;
      color: #900;
      margin-top: 8px;
    }

    .btn-apagar {
      background: #900;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn-exportar {
      background: #333;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .registro {
      border-bottom: 1px solid #eee;
      padding: 15px 0;
    }

    .registro:last-child {
      border-bottom: 0;
    }

    .valor {
      font-size: 24px;
      font-weight: bold;
    }

    .data {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .observacao {
      margin-top: 8px;
      font-size: 15px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      background: #eee;
    }

    .status.ok {
      background: #e7f5e7;
      color: #176b17;
    }

    .status.erro {
      background: #fde8e8;
      color: #9b1c1c;
    }

    .vazio {
      text-align: center;
      color: #777;
      padding: 20px;
    }

  </style>
</head>

<body>

<header>
  <h1>Dextro</h1>
  <p>Controle de glicemia</p>
</header>

<main>

  <div id="status" class="status">
    Pronto para registrar.
  </div>

  <div class="card">

    <label for="glicemia">
      Glicemia (mg/dL)
    </label>

    <input
      id="glicemia"
      type="number"
      min="20"
      max="600"
      inputmode="numeric"
      placeholder="Ex.: 120"
    >

    <label for="observacao">
      Observação
    </label>

    <textarea
      id="observacao"
      placeholder="Ex.: antes do jantar"
    ></textarea>

    <button
      class="btn-principal"
      onclick="registrarGlicemia()"
    >
      Registrar glicemia
    </button>

  </div>

  <div class="card">

    <h2>Histórico</h2>

    <div id="historico"></div>

    <button
      class="btn-exportar"
      onclick="exportarCSV()"
    >
      Exportar CSV
    </button>

    <button
      class="btn-apagar"
      onclick="apagarHistorico()"
    >
      Apagar todo o histórico
    </button>

  </div>

</main>

<script>

  /*
   * COLOQUE AQUI A URL GERADA PELO GOOGLE APPS SCRIPT
   */

  const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbwFFHvYpxbn3cTG6aRtEBHukbygF2E8jcuYvI532nUNgMJnfDYeYM86KjJjzHIMVWjB9A/exec
";


  /*
   * Chave usada no armazenamento local
   */

  const STORAGE_KEY =
    "dextro_registros_v1";


  /*
   * Recupera registros do celular
   */

  function obterRegistros() {

    try {

      return JSON.parse(
        localStorage.getItem(STORAGE_KEY)
      ) || [];

    } catch {

      return [];

    }

  }


  /*
   * Salva registros no celular
   */

  function salvarRegistros(registros) {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(registros)
    );

  }


  /*
   * Escapa HTML para evitar que uma observação
   * seja interpretada como código.
   */

  function escaparHTML(texto) {

    return String(texto)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /*
   * Mostra status para o usuário
   */

  function mostrarStatus(mensagem, tipo = "") {

    const elemento =
      document.getElementById("status");

    elemento.textContent = mensagem;

    elemento.className =
      "status " + tipo;

  }


  /*
   * Registra a glicemia
   */

  async function registrarGlicemia() {

    const campoGlicemia =
      document.getElementById("glicemia");

    const campoObservacao =
      document.getElementById("observacao");

    const valor =
      Number(campoGlicemia.value);

    const observacao =
      campoObservacao.value.trim();


    /*
     * Validação
     */

    if (
      !valor ||
      valor < 20 ||
      valor > 600
    ) {

      alert(
        "Digite uma glicemia entre 20 e 600 mg/dL."
      );

      return;

    }


    /*
     * Captura a data/hora EXATA do momento
     * em que o registro foi feito.
     */

    const agora = new Date();


    /*
     * ID único para evitar duplicações
     */

    const id =
      Date.now().toString() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 8);


    /*
     * Registro completo
     */

    const registro = {

      id: id,

      glicemia: valor,

      observacao: observacao,

      dataHora: agora.toISOString(),

      sincronizado: false

    };


    /*
     * 1 — Salva imediatamente no celular
     */

    const registros =
      obterRegistros();

    registros.unshift(registro);

    salvarRegistros(registros);

    renderizarHistorico();


    /*
     * Limpa formulário
     */

    campoGlicemia.value = "";
    campoObservacao.value = "";


    mostrarStatus(
      "Registro salvo no celular. Sincronizando...",
      ""
    );


    /*
     * 2 — Envia para Google Sheets
     */

    const sucesso =
      await enviarParaGoogle(registro);


    if (sucesso) {

      /*
       * Marca como sincronizado
       */

      const atuais =
        obterRegistros();

      const encontrado =
        atuais.find(
          r => r.id === registro.id
        );

      if (encontrado) {

        encontrado.sincronizado = true;

        salvarRegistros(atuais);

      }

      renderizarHistorico();

      mostrarStatus(
        "Registro salvo no celular e sincronizado com a planilha.",
        "ok"
      );

    } else {

      mostrarStatus(
        "Registro salvo no celular. Não foi possível sincronizar agora.",
        "erro"
      );

    }

  }


  /*
   * Envia um registro ao Google Apps Script
   */

  async function enviarParaGoogle(registro) {

    /*
     * Se a URL ainda não foi configurada,
     * não tenta enviar.
     */

    if (
      !GOOGLE_SCRIPT_URL ||
      GOOGLE_SCRIPT_URL.includes(
        "COLE_AQUI"
      )
    ) {

      return false;

    }


    try {

      /*
       * text/plain evita uma requisição
       * preflight mais complexa no navegador.
       */

      await fetch(
        GOOGLE_SCRIPT_URL,
        {

          method: "POST",

          mode: "no-cors",

          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            id: registro.id,

            dataHora: registro.dataHora,

            glicemia: registro.glicemia,

            observacao: registro.observacao,

            origem: "Dextro"

          })

        }
      );


      /*
       * Com no-cors o navegador não permite
       * ler a resposta do servidor.
       *
       * Por isso consideramos o envio concluído
       * quando a requisição é aceita pelo navegador.
       */

      return true;

    } catch (erro) {

      console.error(
        "Erro ao sincronizar:",
        erro
      );

      return false;

    }

  }


  /*
   * Tenta sincronizar registros que ainda
   * não foram sincronizados.
   */

  async function sincronizarPendentes() {

    const registros =
      obterRegistros();

    let houveAlteracao = false;


    for (
      const registro of registros
    ) {

      if (
        registro.sincronizado
      ) {

        continue;

      }


      const sucesso =
        await enviarParaGoogle(
          registro
        );


      if (sucesso) {

        registro.sincronizado = true;

        houveAlteracao = true;

      }

    }


    if (houveAlteracao) {

      salvarRegistros(registros);

      renderizarHistorico();

    }

  }


  /*
   * Exibe o histórico
   */

  function renderizarHistorico() {

    const container =
      document.getElementById(
        "historico"
      );

    const registros =
      obterRegistros();


    if (
      registros.length === 0
    ) {

      container.innerHTML =
        '<div class="vazio">' +
        'Nenhum registro ainda.' +
        '</div>';

      return;

    }


    container.innerHTML =
      registros.map(
        (registro, indice) => {

          const data =
            new Date(
              registro.dataHora
            );

          const dataFormatada =
            data.toLocaleDateString(
              "pt-BR"
            );

          const horaFormatada =
            data.toLocaleTimeString(
              "pt-BR",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );


          const sincronizacao =
            registro.sincronizado
              ? "Sincronizado"
              : "Aguardando sincronização";


          return `

            <div class="registro">

              <div class="valor">
                ${registro.glicemia} mg/dL
              </div>

              <div class="data">
                ${dataFormatada}
                às
                ${horaFormatada}
              </div>

              ${
                registro.observacao
                  ? `
                    <div class="observacao">
                      ${escaparHTML(
                        registro.observacao
                      )}
                    </div>
                  `
                  : ""
              }

              <div class="data">
                ${sincronizacao}
              </div>

              <button
                class="btn-excluir"
                onclick="excluirRegistro(${indice})"
              >
                Excluir
              </button>

            </div>

          `;

        }
      ).join("");

  }


  /*
   * Exclui um registro somente do celular.
   *
   * A versão seguinte pode incluir exclusão
   * sincronizada na planilha também.
   */

  function excluirRegistro(indice) {

    const confirmar =
      confirm(
        "Excluir este registro do celular?"
      );

    if (!confirmar) {

      return;

    }


    const registros =
      obterRegistros();

    registros.splice(
      indice,
      1
    );

    salvarRegistros(registros);

    renderizarHistorico();

  }


  /*
   * Apaga histórico local
   */

  function apagarHistorico() {

    const confirmar =
      confirm(
        "Apagar todo o histórico deste celular?"
      );

    if (!confirmar) {

      return;

    }


    localStorage.removeItem(
      STORAGE_KEY
    );

    renderizarHistorico();

    mostrarStatus(
      "Histórico local apagado.",
      ""
    );

  }


  /*
   * Exporta os registros locais em CSV
   */

  function exportarCSV() {

    const registros =
      obterRegistros();


    if (
      registros.length === 0
    ) {

      alert(
        "Não existem registros para exportar."
      );

      return;

    }


    let csv =
      "ID;Data/Hora;Glicemia;Observação;Sincronizado\n";


    registros.forEach(
      registro => {

        const observacao =
          String(
            registro.observacao || ""
          )
          .replaceAll('"', '""');


        csv +=
          `"${registro.id}";` +
          `"${registro.dataHora}";` +
          `${registro.glicemia};` +
          `"${observacao}";` +
          `${registro.sincronizado ? "Sim" : "Não"}\n`;

      }
    );


    const blob =
      new Blob(
        [csv],
        {
          type: "text/csv;charset=utf-8;"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");

    link.href = url;

    link.download =
      "historico-glicemia.csv";

    link.click();


    URL.revokeObjectURL(url);

  }


  /*
   * Pressionar Enter no campo de glicemia
   * registra automaticamente.
   */

  document
    .getElementById("glicemia")
    .addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          registrarGlicemia();

        }

      }
    );


  /*
   * Inicialização
   */

  renderizarHistorico();

  /*
   * Tenta enviar registros pendentes
   * quando o aplicativo é aberto.
   */

  sincronizarPendentes();

</script>

</body>
</html>
